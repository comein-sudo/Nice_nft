<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Nice NFT</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: #08090d;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100%;
}

body {
  overflow-x: hidden;
}

button {
  font: inherit;
  border: 0;
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 720px;
  min-height: 100vh;
  margin: auto;
  padding-bottom: 90px;
}

header {
  padding: 18px 18px 8px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(8,9,13,.88);
  backdrop-filter: blur(18px);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: 800;
}

.balance {
  background: #171a22;
  border: 1px solid #292d38;
  border-radius: 14px;
  padding: 9px 13px;
  font-weight: 700;
}

.balance span {
  color: #ffd84d;
}

.page {
  display: none;
  padding: 12px 16px 30px;
}

.page.active {
  display: block;
}

.hero {
  background: linear-gradient(145deg,#171a25,#101218);
  border: 1px solid #272b36;
  border-radius: 24px;
  padding: 22px;
  margin: 8px 0 18px;
}

.hero h1 {
  margin: 0 0 7px;
  font-size: 29px;
}

.hero p {
  color: #9ca1ad;
  margin: 0;
  line-height: 1.45;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 2px 12px;
}

.section-title h2 {
  margin: 0;
  font-size: 19px;
}

.section-title span {
  color: #777d89;
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}

.card {
  position: relative;
  overflow: hidden;
  background: #111319;
  border: 1px solid #252933;
  border-radius: 20px;
  padding: 10px;
  transition: transform .15s ease;
}

.card:active {
  transform: scale(.98);
}

.preview {
  height: 155px;
  border-radius: 15px;
  background: radial-gradient(circle at 50% 35%,#282d3a,#111319 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.preview img,
.preview svg,
.preview canvas {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.card-info {
  padding: 10px 3px 3px;
}

.card-name {
  font-weight: 750;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-type {
  color: #9298a5;
  font-size: 12px;
  margin-top: 3px;
}

.price {
  margin-top: 8px;
  color: #ffd84d;
  font-weight: 800;
}

.badge {
  position: absolute;
  left: 16px;
  top: 16px;
  padding: 5px 8px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 800;
  background: rgba(0,0,0,.62);
  backdrop-filter: blur(6px);
}

.rarity-common { color: #c8cbd2; }
.rarity-rare { color: #5da9ff; }
.rarity-epic { color: #b875ff; }
.rarity-legendary { color: #ffd45b; }

.action {
  width: 100%;
  margin-top: 9px;
  padding: 11px;
  border-radius: 12px;
  background: #242833;
  color: #fff;
  font-weight: 750;
}

.action.primary {
  background: #fff;
  color: #0b0c10;
}

.action.danger {
  background: #382024;
  color: #ff9a9a;
}

.empty {
  padding: 45px 20px;
  text-align: center;
  color: #7d8390;
  border: 1px dashed #2b2f39;
  border-radius: 18px;
}

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(720px,100%);
  z-index: 50;
  padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
  background: rgba(10,11,15,.94);
  backdrop-filter: blur(20px);
  border-top: 1px solid #20232c;
  display: grid;
  grid-template-columns: repeat(4,1fr);
}

.nav-btn {
  background: transparent;
  color: #747a87;
  padding: 8px 2px;
  font-size: 11px;
  font-weight: 700;
}

.nav-btn.active {
  color: #fff;
}

.nav-icon {
  font-size: 20px;
  display: block;
  margin-bottom: 3px;
}

.modal-bg {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.72);
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(5px);
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: min(720px,100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #101217;
  border: 1px solid #292d37;
  border-radius: 26px 26px 0 0;
  padding: 20px;
  animation: up .2s ease;
}

@keyframes up {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal h2 {
  margin: 0 0 15px;
}

.modal-preview {
  width: 100%;
  height: 250px;
  background: radial-gradient(circle,#292e3b,#111319 70%);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.modal-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.attributes {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
  margin-top: 14px;
}

.attribute {
  background: #191c24;
  border-radius: 12px;
  padding: 10px;
}

.attribute small {
  color: #777e8c;
  display: block;
  margin-bottom: 4px;
}

.attribute b {
  font-size: 13px;
}

.close {
  width: 100%;
  margin-top: 9px;
  padding: 13px;
  border-radius: 13px;
  background: #222631;
  color: #fff;
  font-weight: 700;
}

.secret-zone {
  position: fixed;
  left: 0;
  top: 0;
  width: 34vw;
  max-width: 240px;
  height: 55vh;
  z-index: 10;
  pointer-events: auto;
}

.tap-counter {
  position: fixed;
  left: 14px;
  top: 70px;
  z-index: 60;
  background: rgba(0,0,0,.72);
  border: 1px solid #292d38;
  border-radius: 12px;
  padding: 7px 10px;
  color: #8c93a0;
  font-size: 11px;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}

.tap-counter.visible {
  opacity: 1;
}

.secret-result {
  text-align: center;
}

.secret-result .big {
  font-size: 80px;
  margin: 15px;
}

.spin {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.filter-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.filter {
  flex: 0 0 auto;
  background: #171a21;
  color: #969ca8;
  border: 1px solid #272b35;
  border-radius: 11px;
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 700;
}

.filter.active {
  background: #fff;
  color: #0b0c10;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 95px;
  transform: translateX(-50%) translateY(20px);
  z-index: 200;
  background: #fff;
  color: #111;
  padding: 12px 17px;
  border-radius: 14px;
  font-weight: 750;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  max-width: 90%;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (min-width: 600px) {
  .grid {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }

  .preview {
    height: 175px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="top">
    <div class="logo">Nice NFT</div>
    <div class="balance">⭐ <span id="balance">1000</span></div>
  </div>
</header>

<div id="tapCounter" class="tap-counter">Секрет: <span id="tapCount">0</span>/5</div>

<!-- Главная -->
<section id="home" class="page active">

  <div class="hero">
    <h1>Подарки</h1>
    <p>
      Собирай игровые подарки, находи редкие NFT,
      улучшай их и продавай за ⭐.
    </p>
  </div>

  <div class="section-title">
    <h2>Каталог</h2>
    <span id="catalogCount">0</span>
  </div>

  <div class="filter-row">
    <button class="filter active" data-filter="all">Все</button>
    <button class="filter" data-filter="gift">Подарки</button>
    <button class="filter" data-filter="nft">NFT</button>
    <button class="filter" data-filter="rare">Rare</button>
    <button class="filter" data-filter="epic">Epic</button>
    <button class="filter" data-filter="legendary">Legendary</button>
  </div>

  <div id="catalog" class="grid"></div>

</section>

<!-- NFT -->
<section id="nfts" class="page">
  <div class="section-title">
    <h2>NFT</h2>
    <span id="nftCount">0</span>
  </div>

  <div id="nftGrid" class="grid"></div>
</section>

<!-- Инвентарь -->
<section id="inventory" class="page">

  <div class="hero">
    <h1>Инвентарь</h1>
    <p>Твои игровые подарки и NFT.</p>
  </div>

  <div class="section-title">
    <h2>Мои предметы</h2>
    <span id="inventoryCount">0</span>
  </div>

  <div id="inventoryGrid" class="grid"></div>

</section>

<!-- Маркет -->
<section id="market" class="page">

  <div class="hero">
    <h1>Маркет</h1>
    <p>Игровые предметы других пользователей.</p>
  </div>

  <div class="section-title">
    <h2>Выставленные предметы</h2>
    <span id="marketCount">0</span>
  </div>

  <div id="marketGrid" class="grid"></div>

</section>

</div>

<!-- Нижняя навигация -->
<nav class="bottom-nav">

  <button class="nav-btn active" data-page="home">
    <span class="nav-icon">🎁</span>
    Подарки
  </button>

  <button class="nav-btn" data-page="nfts">
    <span class="nav-icon">💎</span>
    NFT
  </button>

  <button class="nav-btn" data-page="inventory">
    <span class="nav-icon">🎒</span>
    Инвентарь
  </button>

  <button class="nav-btn" data-page="market">
    <span class="nav-icon">🛒</span>
    Маркет
  </button>

</nav>

<!-- Модальное окно -->
<div id="modalBg" class="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<div id="toast" class="toast"></div>

<!-- Секретная зона -->
<div id="secretZone" class="secret-zone"></div>

<script>
/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =========================================================
   НАСТРОЙКИ
========================================================= */

const OWNER = "comein-sudo";
const REPO = "nice_nft";

const GITHUB_FOLDERS = [
  "assets/svg",
  "assets/tgs"
];

const STORAGE = {
  balance: "nice_balance",
  inventory: "nice_inventory",
  market: "nice_market",
  generated: "nice_generated"
};


/* =========================================================
   СОХРАНЕНИЕ
========================================================= */

function getJSON(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch {
    return fallback;
  }
}

function saveJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

let balance = Number(localStorage.getItem(STORAGE.balance));

if (!Number.isFinite(balance)) {
  balance = 1000;
  localStorage.setItem(STORAGE.balance, balance);
}

let inventory = getJSON(STORAGE.inventory, []);
let market = getJSON(STORAGE.market, []);
let generated = getJSON(STORAGE.generated, []);

function saveAll() {
  localStorage.setItem(STORAGE.balance, balance);
  saveJSON(STORAGE.inventory, inventory);
  saveJSON(STORAGE.market, market);
  saveJSON(STORAGE.generated, generated);
  updateBalance();
}

function updateBalance() {
  document.getElementById("balance").textContent = balance;
}


/* =========================================================
   ID
========================================================= */

function uid(prefix = "item") {
  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2, 8);
}


/* =========================================================
   ИГРОВЫЕ ПОДАРКИ
========================================================= */

const giftTemplates = [
  {
    id: "rose",
    name: "Rose",
    emoji: "🌹",
    rarity: "common",
    price: 25
  },
  {
    id: "heart",
    name: "Heart",
    emoji: "💝",
    rarity: "common",
    price: 35
  },
  {
    id: "cake",
    name: "Birthday Cake",
    emoji: "🎂",
    rarity: "common",
    price: 50
  },
  {
    id: "bear",
    name: "Teddy Bear",
    emoji: "🧸",
    rarity: "rare",
    price: 100
  },
  {
    id: "diamond",
    name: "Diamond",
    emoji: "💎",
    rarity: "rare",
    price: 175
  },
  {
    id: "crystal",
    name: "Crystal",
    emoji: "🔮",
    rarity: "epic",
    price: 350
  },
  {
    id: "crown",
    name: "Golden Crown",
    emoji: "👑",
    rarity: "legendary",
    price: 1000
  },
  {
    id: "rocket",
    name: "Rocket",
    emoji: "🚀",
    rarity: "epic",
    price: 500
  }
];


/* =========================================================
   NFT TEMPLATES
========================================================= */

const nftTemplates = [
  {
    id: "lootbag",
    name: "Loot Bag",
    emoji: "🎁",
    rarity: "rare",
    price: 250,
    models: [
      "Jaune Poussin",
      "Blue Bunny",
      "Golden Worker",
      "Pink Cat"
    ],
    backgrounds: [
      "Dark Lilac",
      "Ocean Blue",
      "Golden",
      "Cosmic",
      "Neon"
    ],
    symbols: [
      "Worker Ant",
      "Diamond",
      "Star",
      "Heart",
      "Moon"
    ]
  },
  {
    id: "cosmicbox",
    name: "Cosmic Box",
    emoji: "📦",
    rarity: "epic",
    price: 600,
    models: [
      "Cosmic",
      "Nebula",
      "Astral",
      "Galaxy"
    ],
    backgrounds: [
      "Cosmic",
      "Void",
      "Purple",
      "Starlight"
    ],
    symbols: [
      "Star",
      "Planet",
      "Moon",
      "Comet"
    ]
  },
  {
    id: "goldencrown",
    name: "Golden Crown",
    emoji: "👑",
    rarity: "legendary",
    price: 2000,
    models: [
      "Royal Gold",
      "Diamond King",
      "Solar Crown"
    ],
    backgrounds: [
      "Gold",
      "Royal Purple",
      "Black Gold",
      "Sun"
    ],
    symbols: [
      "Crown",
      "Diamond",
      "Sun",
      "Lion"
    ]
  }
];


/* =========================================================
   RANDOM
========================================================= */

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function randomNFT(template) {
  return {
    instanceId: uid("nft"),
    templateId: template.id,
    type: "nft",
    name: template.name,
    emoji: template.emoji,
    rarity: template.rarity,
    price: template.price,

    model: random(template.models),
    background: random(template.backgrounds),
    symbol: random(template.symbols),

    createdAt: Date.now()
  };
}

function randomGift(template) {
  return {
    instanceId: uid("gift"),
    templateId: template.id,
    type: "gift",
    name: template.name,
    emoji: template.emoji,
    rarity: template.rarity,
    price: template.price,
    createdAt: Date.now()
  };
}


/* =========================================================
   ПРЕВЬЮ
========================================================= */

function previewElement(item) {

  if (item.image) {
    const img = document.createElement("img");
    img.src = item.image;
    img.loading = "lazy";
    return img;
  }

  const div = document.createElement("div");

  div.style.fontSize = "76px";
  div.textContent = item.emoji || "🎁";

  return div;
}


/* =========================================================
   GITHUB ASSETS
========================================================= */

let githubNFTs = [];

async function loadGitHubAssets() {

  const result = [];

  for (const folder of GITHUB_FOLDERS) {

    try {

      const url =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}`;

      const response = await fetch(url);

      if (!response.ok) continue;

      const files = await response.json();

      for (const file of files) {

        if (!file.download_url) continue;

        const ext = file.name.split(".").pop().toLowerCase();

        if (ext !== "svg" && ext !== "tgs") continue;

        result.push({
          instanceId: uid("asset"),
          templateId: file.name,
          type: "gift",
          name: file.name.replace(/\.(svg|tgs)$/i, ""),
          rarity: "common",
          price: 25,
          emoji: "🎁",
          image: file.download_url
        });

      }

    } catch (error) {
      console.log("GitHub assets error:", error);
    }
  }

  githubNFTs = result;
}


/* =========================================================
   CARD
========================================================= */

function createCard(item, options = {}) {

  const card = document.createElement("div");
  card.className = "card";

  const preview = document.createElement("div");
  preview.className = "preview";

  preview.appendChild(previewElement(item));

  const badge = document.createElement("div");
  badge.className = "badge rarity-" + item.rarity;
  badge.textContent =
    item.type === "nft"
      ? "NFT"
      : item.rarity.toUpperCase();

  card.appendChild(badge);
  card.appendChild(preview);

  const info = document.createElement("div");
  info.className = "card-info";

  const name = document.createElement("div");
  name.className = "card-name";
  name.textContent = item.name;

  const type = document.createElement("div");
  type.className = "card-type";

  if (item.type === "nft") {
    type.textContent =
      `${item.model} · ${item.background}`;
  } else {
    type.textContent = "Обычный подарок";
  }

  const price = document.createElement("div");
  price.className = "price";
  price.textContent = `⭐ ${item.price}`;

  info.appendChild(name);
  info.appendChild(type);
  info.appendChild(price);

  card.appendChild(info);

  card.addEventListener("click", () => openItem(item, options));

  return card;
}


/* =========================================================
   КАТАЛОГ
========================================================= */

let currentFilter = "all";

function getCatalog() {

  const gifts = giftTemplates.map(randomGift);
  const nfts = nftTemplates.map(randomNFT);

  return [
    ...gifts,
    ...nfts,
    ...githubNFTs
  ];
}

let catalog = [];

function renderCatalog() {

  const container = document.getElementById("catalog");

  container.innerHTML = "";

  let list = catalog;

  if (currentFilter !== "all") {

    if (
      currentFilter === "gift" ||
      currentFilter === "nft"
    ) {
      list = list.filter(
        x => x.type === currentFilter
      );
    } else {
      list = list.filter(
        x => x.rarity === currentFilter
      );
    }
  }

  document.getElementById("catalogCount").textContent =
    list.length;

  list.forEach(item => {
    container.appendChild(
      createCard(item, { catalog: true })
    );
  });
}


/* =========================================================
   NFT PAGE
========================================================= */

function renderNFTs() {

  const grid = document.getElementById("nftGrid");

  grid.innerHTML = "";

  const list = [
    ...nftTemplates.map(randomNFT),
    ...inventory.filter(x => x.type === "nft")
  ];

  document.getElementById("nftCount").textContent =
    list.length;

  list.forEach(item => {
    grid.appendChild(createCard(item));
  });
}


/* =========================================================
   INVENTORY
========================================================= */

function renderInventory() {

  const grid = document.getElementById("inventoryGrid");

  grid.innerHTML = "";

  document.getElementById("inventoryCount").textContent =
    inventory.length;

  if (!inventory.length) {

    grid.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        Инвентарь пуст.<br><br>
        Сделай 5 тапов по левой стороне главной страницы,
        чтобы получить подарок.
      </div>
    `;

    return;
  }

  inventory.forEach(item => {

    grid.appendChild(
      createCard(item, { inventory: true })
    );

  });
}


/* =========================================================
   MARKET
========================================================= */

function renderMarket() {

  const grid = document.getElementById("marketGrid");

  grid.innerHTML = "";
