<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nice NFT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#070707;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

button{font-family:inherit}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px;
    padding-bottom:100px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.balance{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:10px 14px;
    font-weight:800;
}

/* NAV */

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:24px;
}

.tab{
    border:1px solid #292929;
    background:#111;
    color:#777;
    border-radius:12px;
    padding:10px 17px;
    cursor:pointer;
}

.tab.active{
    background:#fff;
    color:#000;
}

/* SECTIONS */

.section{display:none}
.section.active{display:block}

.title{
    font-size:28px;
    font-weight:900;
    margin-bottom:6px;
}

.subtitle{
    color:#777;
    margin-bottom:20px;
}

/* CASES */

.case-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.case{
    background:#111;
    border:1px solid #272727;
    border-radius:19px;
    padding:12px;
    transition:.15s;
}

.case:hover{
    transform:translateY(-2px);
    border-color:#444;
}

.case-image{
    width:100%;
    aspect-ratio:1;
    border-radius:14px;
    background:#191919;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:12px;
}

.case-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.case-icon{
    font-size:55px;
}

.case-name{
    font-size:18px;
    font-weight:900;
    margin-bottom:5px;
}

.case-description{
    color:#777;
    font-size:13px;
    min-height:34px;
    margin-bottom:12px;
}

.case-price{
    font-weight:800;
    margin-bottom:10px;
}

.open-btn{
    width:100%;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#000;
    padding:12px;
    font-weight:900;
    cursor:pointer;
}

.open-btn:active{
    transform:scale(.97);
}

/* NFT */

.nft-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
}

.nft-card{
    background:#111;
    border:1px solid #272727;
    border-radius:17px;
    padding:9px;
    cursor:pointer;
    transition:.15s;
}

.nft-card:hover{
    transform:translateY(-2px);
    border-color:#444;
}

.nft-preview{
    width:100%;
    aspect-ratio:1;
    border-radius:12px;
    background:#191919;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.nft-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.tgs-label{
    color:#777;
    font-weight:900;
    font-size:14px;
}

.nft-name{
    margin-top:9px;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.nft-type{
    color:#666;
    font-size:11px;
    margin-top:4px;
}

/* EMPTY */

.empty{
    grid-column:1/-1;
    padding:45px 15px;
    border:1px dashed #292929;
    border-radius:17px;
    color:#666;
    text-align:center;
}

/* OPENING */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid #292929;
    border-radius:24px;
    padding:20px;
    text-align:center;
}

.modal-title{
    font-size:24px;
    font-weight:900;
    margin-bottom:7px;
}

.modal-text{
    color:#777;
    margin-bottom:18px;
}

.roulette{
    width:100%;
    aspect-ratio:1;
    background:#191919;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:18px;
    position:relative;
}

.roulette img{
    width:90%;
    height:90%;
    object-fit:contain;
}

.roulette.tgs{
    color:#777;
    font-weight:900;
}

.spin{
    animation:spinNFT .35s linear infinite;
}

@keyframes spinNFT{
    0%{transform:scale(.88) rotate(-4deg)}
    50%{transform:scale(1.04) rotate(4deg)}
    100%{transform:scale(.88) rotate(-4deg)}
}

.close-btn{
    width:100%;
    border:0;
    background:#fff;
    color:#000;
    padding:12px;
    border-radius:12px;
    font-weight:900;
    cursor:pointer;
}

/* BOTTOM */

.bottom-nav{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:870px;
    background:rgba(17,17,17,.95);
    border:1px solid #292929;
    border-radius:18px;
    padding:8px;
    display:flex;
    gap:6px;
    backdrop-filter:blur(15px);
    z-index:50;
}

.nav-btn{
    flex:1;
    border:0;
    background:transparent;
    color:#777;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
}

.nav-btn.active{
    background:#fff;
    color:#000;
    font-weight:900;
}

/* MOBILE */

@media(max-width:650px){

    .case-grid{
        grid-template-columns:1fr 1fr;
    }

    .nft-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .case-description{
        min-height:auto;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="logo">
        NICE NFT
    </div>

    <div class="balance">
        ⭐ <span id="balance">100</span>
    </div>

</header>


<!-- TOP NAV -->

<div class="tabs">

    <button
        class="tab active"
        onclick="goTo('cases')"
    >
        Кейсы
    </button>

    <button
        class="tab"
        onclick="goTo('inventory')"
    >
        Инвентарь
    </button>

    <button
        class="tab"
        onclick="goTo('market')"
    >
        Маркет
    </button>

</div>


<!-- CASES -->

<section
    id="cases"
    class="section active"
>

    <div class="title">
        Кейсы
    </div>

    <div class="subtitle">
        Выбирай кейс и получай случайный NFT.
    </div>

    <div
        id="caseGrid"
        class="case-grid"
    ></div>

</section>


<!-- INVENTORY -->

<section
    id="inventory"
    class="section"
>

    <div class="title">
        Инвентарь
    </div>

    <div class="subtitle">
        NFT, которые ты получил.
    </div>

    <div
        id="inventoryGrid"
        class="nft-grid"
    ></div>

</section>


<!-- MARKET -->

<section
    id="market"
    class="section"
>

    <div class="title">
        Маркет
    </div>

    <div class="subtitle">
        Доступные NFT.
    </div>

    <div
        id="marketGrid"
        class="nft-grid"
    ></div>

</section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button
        class="nav-btn active"
        onclick="goTo('cases')"
    >
        Кейсы
    </button>

    <button
        class="nav-btn"
        onclick="goTo('inventory')"
    >
        NFT
    </button>

    <button
        class="nav-btn"
        onclick="goTo('market')"
    >
        Маркет
    </button>

</nav>


<!-- OPENING MODAL -->

<div
    id="openModal"
    class="modal"
>

    <div class="modal-box">

        <div
            id="modalTitle"
            class="modal-title"
        >
            Открытие
        </div>

        <div
            id="roulette"
            class="roulette"
        ></div>

        <div
            id="modalText"
            class="modal-text"
        >
            Открываем кейс...
        </div>

        <button
            id="modalButton"
            class="close-btn"
            onclick="closeModal()"
        >
            Закрыть
        </button>

    </div>

</div>


<script>

/* =====================================================
   GITHUB
===================================================== */

const OWNER = "comein-sudo";
const REPOSITORY = "nice_nft";

const FOLDERS = [
    "assets/svg",
    "assets/tgs"
];


/* =====================================================
   CASES
===================================================== */

const CASES = [

    {
        id:"daily",
        name:"Daily",
        description:"Бесплатный кейс раз в 24 часа.",
        price:"FREE",
        cooldown:true,
        cost:0,
        icon:"🎁"
    },

    {
        id:"basic",
        name:"Basic",
        description:"Обычный кейс с базовыми NFT.",
        price:"10 ⭐",
        cost:10
    },

    {
        id:"rare",
        name:"Rare",
        description:"Повышенный шанс на редкие NFT.",
        price:"25 ⭐",
        cost:25
    },

    {
        id:"epic",
        name:"Epic",
        description:"Редкие и эпические NFT.",
        price:"50 ⭐",
        cost:50
    },

    {
        id:"legendary",
        name:"Legendary",
        description:"Самый дорогой кейс коллекции.",
        price:"100 ⭐",
        cost:100
    }

];


/* =====================================================
   STATE
===================================================== */

let allNFTs = [];

let inventory = JSON.parse(
    localStorage.getItem("nice_inventory") || "[]"
);

let balance = Number(
    localStorage.getItem("nice_balance") || 100
);

document.getElementById(
    "balance"
).textContent = balance;


/* =====================================================
   LOAD GITHUB FOLDER
===================================================== */

async function loadFolder(folder){

    const api =
        `https://api.github.com/repos/${OWNER}/${REPOSITORY}/contents/${folder}`;

    try{

        const response =
            await fetch(api);

        if(!response.ok){

            console.error(
                "GitHub API:",
                response.status
            );

            return [];
        }

        const files =
            await response.json();

        return files

            .filter(
                file => file.type === "file"
            )

            .filter(file => {

                const name =
                    file.name.toLowerCase();

                return (
                    name.endsWith(".svg") ||
                    name.endsWith(".tgs")
                );

            })

            .map(file => {

                const extension =
                    file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

                return {

                    name:file.name,

                    path:file.path,

                    type:extension,

                    url:
                    `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/main/${file.path}`

                };

            });

    }catch(error){

        console.error(error);

        return [];
    }
}


/* =====================================================
   LOAD NFT
===================================================== */

async function loadNFTs(){

    const results =
        await Promise.all(
            FOLDERS.map(loadFolder)
        );

    allNFTs =
        results.flat();

    console.log(
        "NFT:",
        allNFTs.length
    );

    renderCases();
    renderMarket();
    renderInventory();
}


/* =====================================================
   CASE RENDER
===================================================== */

function renderCases(){

    const grid =
        document.getElementById(
            "caseGrid"
        );

    grid.innerHTML = "";

    CASES.forEach(caseData => {

        const card =
            document.createElement("div");

        card.className = "case";


        const image =
            document.createElement("div");

        image.className =
            "case-image";


        const icon =
            document.createElement("div");

        icon.className =
            "case-icon";

        icon.textContent =
            caseData.icon || "💎";

        image.appendChild(icon);

        card.appendChild(image);


        const name =
            document.createElement("div");

        name.className =
            "case-name";

        name.textContent =
            caseData.name;

        card.appendChild(name);


        const description =
            document.createElement("div");

        description.className =
            "case-description";

        description.textContent =
            caseData.description;

        card.appendChild(description);


        const price =
            document.createElement("div");

        price.className =
            "case-price";

        price.textContent =
            caseData.price;

        card.appendChild(price);


        const button =
            document.createElement("button");

        button.className =
            "open-btn";

        button.textContent =
            "Открыть";

        button.onclick = () =>
            openCase(caseData);

        card.appendChild(button);


        grid.appendChild(card);

    });
}


/* =====================================================
   NFT PREVIEW
===================================================== */

function createNFTPreview(nft){

    const box =
        document.createElement("div");

    box.className =
        "nft-preview";


    if(nft.type === "svg"){

        const img =
            document.createElement("img");

        img.src = nft.url;

        img.alt = nft.name;

        box.appendChild(img);

    }else{

        const label =
            document.createElement("div");

        label.className =
            "tgs-label";

        label.textContent =
            "TGS";

        box.appendChild(label);
    }


    return box;
}


/* =====================================================
   NFT CARD
===================================================== */

function createNFTCard(nft){

    const card =
        document.createElement("div");

    card.className =
        "nft-card";


    const preview =
        createNFTPreview(nft);

    card.appendChild(preview);


    const name =
        document.createElement("div");

    name.className =
        "nft-name";

    name.textContent =
        nft.name.replace(
            /\.[^/.]+$/,
            ""
        );

    card.appendChild(name);


    const type =
        document.createElement("div");

    type.className =
        "nft-type";

    type.textContent =
        nft.type.toUpperCase();

    card.appendChild(type);


    card.onclick = () =>
        showNFT(nft);

    return card;
}


/* =====================================================
   MARKET
===================================================== */

function renderMarket(){

    const grid =
        document.getElementById(
            "marketGrid"
        );

    grid.innerHTML = "";


    if(!allNFTs.length){

        grid.innerHTML = `
            <div class="empty">
                NFT пока не найдены.
            </div>
        `;

        return;
    }


    allNFTs.forEach(nft => {

        grid.appendChild(
            createNFTCard(nft)
        );

    });
}


/* =====================================================
   INVENTORY
===================================================== */

function renderInventory(){

    const grid =
        document.getElementById(
            "inventoryGrid"
        );

    grid.innerHTML = "";


    if(!inventory.length){

        grid.innerHTML = `
            <div class="empty">
                Инвентарь пуст.
                <br><br>
                Открой кейс, чтобы получить NFT.
            </div>
        `;

        return;
    }


    inventory.forEach(nft => {

        grid.appendChild(
            createNFTCard(nft)
        );

    });
}


/* =====================================================
   CASE RANDOM
===================================================== */

function getRandomNFT(){

    if(!allNFTs.length){
        return null;
    }


    const index =
        Math.floor(
            Math.random() *
            allNFTs.length
        );


    return allNFTs[index];
}


/* =====================================================
   OPEN CASE
===================================================== */

function openCase(caseData){

    if(!allNFTs.length){

        alert(
            "NFT ещё загружаются."
        );

        return;
    }


    /* DAILY */

    if(caseData.id === "daily"){

        const last =
            Number(
                localStorage.getItem(
                    "nice_daily_time"
                ) || 0
            );

        const now =
            Date.now();

        const cooldown =
            24 * 60 * 60 * 1000;


        if(
            now - last <
            cooldown
        ){

            const remaining =
                cooldown -
                (now - last);

            const hours =
                Math.ceil(
                    remaining /
                    3600000
                );

            alert(
                `Daily будет доступен через ${hours} ч.`
            );

            return;
        }


        localStorage.setItem(
            "nice_daily_time",
            now
        );
    }


    /* STARS */

    if(caseData.cost > 0){

        if(balance < caseData.cost){

            alert(
                "Недостаточно ⭐"
            );

            return;
        }


        balance -=
            caseData.cost;

        localStorage.setItem(
            "nice_balance",
            balance
        );

        document.getElementById(
            "balance"
        ).textContent =
            balance;
    }


    const nft =
        getRandomNFT();


    if(!nft){
        return;
    }


    showOpening(
        caseData,
        nft
    );
}


/* =====================================================
   OPENING ANIMATION
===================================================== */

function showOpening(
    caseData,
    finalNFT
){

    const modal =
        document.getElementById(
            "openModal"
        );

    const title =
        document.getElementById(
            "modalTitle"
        );

    const roulette =
        document.getElementById(
            "roulette"
        );

    const text =
        document.getElementById(
            "modalText"
        );

    const button =
        document.getElementById(
            "modalButton"
        );


    title.textContent =
        caseData.name;


    text.textContent =
        "Открываем кейс...";


    button.style.display =
        "none";


    roulette.innerHTML = "";


    const preview =
        createNFTPreview(finalNFT);


    roulette.appendChild(
        preview
    );


    preview.classList.add(
        "spin"
    );


    modal.classList.add(
        "show"
    );


    setTimeout(() => {

        preview.classList.remove(
            "spin"
        );


        title.textContent =
            "Поздравляем!";


        text.textContent =
            `Ты получил ${finalNFT.name.replace(/\.[^/.]+$/,"")}`;


        button.textContent =
            "Забрать NFT";


        button.style.display =
            "block";


        button.onclick = () => {

            inventory.push(
                finalNFT
            );


            localStorage.setItem(
                "nice_inventory",
                JSON.stringify(
                    inventory
                )
            );


            renderInventory();


            closeModal();


            goTo("inventory");

        };


    }, 2200);
}


/* =====================================================
   SHOW NFT
===================================================== */

function showNFT(nft){

    const modal =
        document.getElementById(
            "openModal"
        );

    const title =
        document.getElementById(
            "modalTitle"
        );

    const roulette =
        document.getElementById(
            "roulette"
        );

    const text =
        document.getElementById(
            "modalText"
        );

    co
