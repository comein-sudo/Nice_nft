<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nice NFT</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #070707;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

button {
    font-family: inherit;
}

.app {
    max-width: 900px;
    margin: auto;
    padding: 18px;
    padding-bottom: 100px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.logo {
    font-size: 26px;
    font-weight: 900;
}

.balance {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 10px 14px;
    font-weight: 800;
}

/* TABS */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

.tab {
    border: 1px solid #292929;
    background: #111;
    color: #777;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
}

.tab.active {
    background: white;
    color: black;
}

/* SECTIONS */

.section {
    display: none;
}

.section.active {
    display: block;
}

.title {
    font-size: 27px;
    font-weight: 900;
    margin-bottom: 7px;
}

.subtitle {
    color: #777;
    margin-bottom: 20px;
}

/* CASES */

.cases {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.case {
    background: #111;
    border: 1px solid #252525;
    border-radius: 18px;
    padding: 12px;
}

.case-preview {
    height: 160px;
    border-radius: 13px;
    background: #191919;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    overflow: hidden;
}

.case-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.case-name {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 5px;
}

.case-description {
    color: #777;
    font-size: 13px;
    margin-bottom: 12px;
}

.open-button {
    width: 100%;
    border: 0;
    background: white;
    color: black;
    padding: 11px;
    border-radius: 11px;
    font-weight: 800;
    cursor: pointer;
}

/* NFT GRID */

.nft-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 13px;
}

.nft-card {
    background: #111;
    border: 1px solid #252525;
    border-radius: 17px;
    padding: 9px;
}

.nft-image {
    aspect-ratio: 1;
    width: 100%;
    background: #191919;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nft-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.nft-name {
    margin-top: 9px;
    font-weight: 800;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.nft-type {
    color: #666;
    font-size: 11px;
    margin-top: 4px;
}

/* TGS */

.tgs-container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tgs-placeholder {
    color: #777;
    font-weight: 800;
    font-size: 13px;
}

/* EMPTY */

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px;
    border: 1px dashed #292929;
    border-radius: 17px;
    color: #666;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 420px;
    background: #111;
    border: 1px solid #292929;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
}

.modal-preview {
    width: 100%;
    aspect-ratio: 1;
    background: #191919;
    border-radius: 17px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
}

.modal-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.modal-title {
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 7px;
}

.modal-description {
    color: #777;
    margin-bottom: 17px;
}

.close-button {
    width: 100%;
    border: 0;
    background: white;
    color: black;
    border-radius: 12px;
    padding: 12px;
    font-weight: 800;
    cursor: pointer;
}

/* BOTTOM */

.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 870px;
    background: rgba(17,17,17,.95);
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 8px;
    display: flex;
    gap: 6px;
    backdrop-filter: blur(15px);
    z-index: 50;
}

.nav-button {
    flex: 1;
    border: 0;
    background: transparent;
    color: #777;
    border-radius: 12px;
    padding: 10px;
    cursor: pointer;
}

.nav-button.active {
    background: white;
    color: black;
    font-weight: 800;
}

/* MOBILE */

@media (max-width: 650px) {

    .cases {
        grid-template-columns: 1fr;
    }

    .nft-grid {
        grid-template-columns: repeat(2, 1fr);
    }

}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            NICE NFT
        </div>

        <div class="balance">
            ⭐ <span id="balance">100</span>
        </div>

    </header>


    <div class="tabs">

        <button
            class="tab active"
            onclick="switchPage('cases')"
        >
            Кейсы
        </button>

        <button
            class="tab"
            onclick="switchPage('inventory')"
        >
            Инвентарь
        </button>

        <button
            class="tab"
            onclick="switchPage('market')"
        >
            Маркет
        </button>

    </div>


    <!-- CASES -->

    <section
        id="cases"
        class="section active"
    >

        <div class="title">
            Кейсы
        </div>

        <div class="subtitle">
            Открывай кейсы и получай NFT.
        </div>


        <div class="cases">

            <div class="case">

                <div class="case-preview">
                    <div class="tgs-placeholder">
                        DAILY
                    </div>
                </div>

                <div class="case-name">
                    Daily
                </div>

                <div class="case-description">
                    Бесплатный кейс раз в 24 часа
                </div>

                <button
                    class="open-button"
                    onclick="openDaily()"
                >
                    Открыть
                </button>

            </div>


            <div class="case">

                <div class="case-preview">
                    <div class="tgs-placeholder">
                        PROMO
                    </div>
                </div>

                <div class="case-name">
                    Promo
                </div>

                <div class="case-description">
                    Открывается по промокоду
                </div>

                <button
                    class="open-button"
                    onclick="openPromo()"
                >
                    Ввести код
                </button>

            </div>


            <div class="case">

                <div class="case-preview">
                    <div class="tgs-placeholder">
                        STARS
                    </div>
                </div>

                <div class="case-name">
                    Stars
                </div>

                <div class="case-description">
                    Открытие за Stars
                </div>

                <button
                    class="open-button"
                    onclick="openStars()"
                >
                    Открыть
                </button>

            </div>

        </div>

    </section>


    <!-- INVENTORY -->

    <section
        id="inventory"
        class="section"
    >

        <div class="title">
            Инвентарь
        </div>

        <div class="subtitle">
            Твои NFT.
        </div>

        <div
            id="inventoryGrid"
            class="nft-grid"
        ></div>

    </section>


    <!-- MARKET -->

    <section
        id="market"
        class="section"
    >

        <div class="title">
            Маркет
        </div>

        <div class="subtitle">
            NFT из коллекции.
        </div>

        <div
            id="marketGrid"
            class="nft-grid"
        ></div>

    </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button
        class="nav-button active"
        onclick="switchPage('cases')"
    >
        Кейсы
    </button>

    <button
        class="nav-button"
        onclick="switchPage('inventory')"
    >
        NFT
    </button>

    <button
        class="nav-button"
        onclick="switchPage('market')"
    >
        Маркет
    </button>

</nav>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
    onclick="closeOutside(event)"
>

    <div class="modal-box">

        <div
            id="modalPreview"
            class="modal-preview"
        ></div>

        <div
            id="modalTitle"
            class="modal-title"
        >
            NFT
        </div>

        <div
            id="modalDescription"
            class="modal-description"
        >
            Ты получил NFT.
        </div>

        <button
            class="close-button"
            onclick="closeModal()"
        >
            Забрать
        </button>

    </div>

</div>


<script>

/* =========================================================
   GITHUB
========================================================= */

const OWNER = "comein-sudo";
const REPOSITORY = "Nice_nft";

const NFT_FOLDERS = [
    "assets/svg",
    "assets/tgs"
];

let allNFTs = [];

let inventory = JSON.parse(
    localStorage.getItem("nice_inventory") || "[]"
);

let balance = Number(
    localStorage.getItem("nice_balance") || 100
);

document.getElementById("balance").textContent = balance;


/* =========================================================
   LOAD FILES
========================================================= */

async function loadFolder(folder) {

    const url =
        `https://api.github.com/repos/${OWNER}/${REPOSITORY}/contents/${folder}`;

    try {

        const response = await fetch(url);

        if (!response.ok) {
            console.error(
                "GitHub error:",
                response.status
            );

            return [];
        }

        const files = await response.json();

        return files
            .filter(file => file.type === "file")
            .filter(file => {

                const name =
                    file.name.toLowerCase();

                return (
                    name.endsWith(".svg") ||
                    name.endsWith(".tgs")
                );

            })
            .map(file => {

                const extension =
                    file.name
                        .split(".")
                        .pop()
                        .toLowerCase();

                return {

                    name: file.name,

                    path: file.path,

                    type: extension,

                    url:
                        `https://raw.githubusercontent.com/${OWNER}/${REPOSITORY}/main/${file.path}`

                };

            });

    } catch (error) {

        console.error(
            "Ошибка загрузки:",
            error
        );

        return [];
    }
}


/* =========================================================
   LOAD ALL NFT
========================================================= */

async function loadNFTs() {

    const result =
        await Promise.all(
            NFT_FOLDERS.map(loadFolder)
        );

    allNFTs =
        result.flat();

    console.log(
        "NFT загружено:",
        allNFTs.length
    );

    renderMarket();

    renderInventory();
}


/* =========================================================
   CREATE PREVIEW
========================================================= */

function createPreview(nft) {

    const container =
        document.createElement("div");

    container.className = "nft-image";


    /* SVG */

    if (nft.type === "svg") {

        const img =
            document.createElement("img");

        img.src = nft.url;

        img.alt = nft.name;

        container.appendChild(img);

        return container;
    }


    /* TGS */

    if (nft.type === "tgs") {

        /*
         * TGS нельзя напрямую показать
         * через <img>.
         *
         * Ниже пока показываем обозначение TGS.
         * Сам файл при этом уже найден GitHub API.
         */

        const text =
            document.createElement("div");

        text.className =
            "tgs-placeholder";

        text.textContent =
            "TGS";

        container.appendChild(text);

        return container;
    }


    return container;
}


/* =========================================================
   NFT CARD
========================================================= */

function createNFTCard(nft) {

    const card =
        document.createElement("div");

    card.className =
        "nft-card";


    const preview =
        createPreview(nft);

    card.appendChild(preview);


    const name =
        document.createElement("div");

    name.className =
        "nft-name";

    name.textContent =
        nft.name.replace(/\.[^/.]+$/, "");

    card.appendChild(name);


    const type =
        document.createElement("div");

    type.className =
        "nft-type";

    type.textContent =
        nft.type.toUpperCase();

    card.appendChild(type);


    return card;
}


/* =========================================================
   MARKET
========================================================= */

function renderMarket() {

    const grid =
        document.getElementById(
            "marketGrid"
        );

    grid.innerHTML = "";


    if (!allNFTs.length) {

        grid.innerHTML = `
            <div class="empty">
                NFT не найдены
            </div>
        `;

        return;
    }


    allNFTs.forEach(nft => {

        grid.appendChild(
            createNFTCard(nft)
        );

    });
}


/* =========================================================
   INVENTORY
========================================================= */

function renderInventory() {

    const grid =
        document.getElementById(
            "inventoryGrid"
        );

    grid.innerHTML = "";


    if (!inventory.length) {

        grid.innerHTML = `
            <div class="empty">
                Инвентарь пуст
            </div>
        `;

        return;
    }


    inventory.forEach(nft => {

        grid.appendChild(
            createNFTCard(nft)
        );

    });
}


/* =========================================================
   RANDOM NFT
========================================================= */

function randomNFT() {

    if (!allNFTs.length) {
        return null;
    }

    const index =
        Math.floor(
            Math.random() *
            allNFTs.length
        );

    return allNFTs[index];
}


/* =========================================================
   ADD NFT
========================================================= */

function addNFT(nft) {

    inventory.push(nft);

    localStorage.setItem(
        "nice_inventory",
        JSON.stringify(inventory)
    );

    renderInventory();

    showNFT(nft);
}


/* =========================================================
   DAILY
========================================================= */

function openDaily() {

    const last =
        Number(
            localStorage.getItem(
                "nice_daily"
            ) || 0
        );

    const now =
        Date.now();

    const cooldown =
        24 * 60 * 60 * 1000;


    if (
        now - last <
        cooldown
    ) {

        const remaining =
            cooldown -
            (now - last);

        const hours =
            Math.ceil(
                remaining /
                3600000
            );

        alert(
            `Daily будет доступен через ${hours} ч.`
        );

        return;
    }


    const nft =
        randomNFT();

    if (!nft) {

        alert(
            "NFT ещё не загрузились."
        );

        return;
    }


    localStorage.setItem(
        "nice_daily",
        now
    );


    addNFT(nft);
}


/* =========================================================
   PROMO
========================================================= */

function openPromo() {

    const code =
        prompt(
            "Введите промокод:"
        );

    if (!code) {
        return;
    }


    if (
        code.trim().toUpperCase()
        !== "NFT2026"
    ) {

        alert(
            "Неверный промокод."
        );

        return;
    }


    if (
        localStorage.getItem(
            "promo_used"
        )
    ) {

        alert(
            "Промокод уже использован."
        );

        return;
    }


    const nft =
        randomNFT();

    if (!nft) {
        return;
    }


    localStorage.setItem(
        "promo_used",
        "1"
    );


    addNFT(nft);
}


/* =========================================================
   STARS
========================================================= */

function openStars() {

    if (balance < 10) {

        alert(
            "Недостаточно Stars."
        );

        return;
    }


    const nft =
        randomNFT();

    if (!nft) {
        return;
    }


    balance -= 10;

    localStorage.setItem(
        "nice_balance",
        balance
    );

    document.getElementById(
        "balance"
    ).textContent = balance;


    addNFT(nft);
}


/* =========================================================
   SHOW NFT
========================================================= */

function showNFT(nft) {

    const modal =
        document.getElementById(
            "modal"
        );

    const preview =
        document.getElementById(
            "modalPreview"
        );

    preview.innerHTML = "";


    const nftPreview =
        createPreview(nft);


    preview.appendChild(
        nftPreview
    );


    document.getElementById(
        "modalTitle"
    ).textContent =
        nft.name.replace(
            /\.[^/.]+$/,
            ""
        );


    document.getElementById(
        "modalDescription"
    ).textContent =
        `Новый NFT · ${nft.type.toUpperCase()}`;


    modal.classList.add(
        "active"
    );
}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("active");
}


function closeOutside(event) {

    if (
        event.target.id === "modal"
    ) {

        closeModal();

    }
}


/* =========================================================
   NAVIGATION
========================================================= */

function switchPage(page) {

    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove(
                "active"
            );

        });


    document
        .getElementById(page)
        .classList.add("active");


    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    document
        .querySelectorAll(".nav-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });


    const pages = [
        "cases",
        "inventory",
        "market"
    ];

    const index =
        pages.indexOf(page);


    const
